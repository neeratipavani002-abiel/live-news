
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="StreamTube - Your video streaming platform">

    <title>StreamTube</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="header">

        <!-- LEFT -->
        <div class="header-left">

            <button class="menu-btn" id="menuBtn">
                ☰
            </button>

            <a href="#" class="logo">
                <span class="logo-icon">▶</span>
                <span>StreamTube</span>
            </a>

        </div>


        <!-- SEARCH -->
        <div class="search-container">

            <input
                type="text"
                id="searchInput"
                placeholder="Search videos..."
                autocomplete="off"
            >

            <button
                class="search-btn"
                id="searchBtn"
                type="button"
            >
                🔍
            </button>

        </div>


        <!-- RIGHT -->
        <div class="header-right">

            <button
                class="icon-btn"
                id="notificationBtn"
                title="Notifications"
            >
                🔔
            </button>

            <button
                class="profile-btn"
                title="Profile"
            >
                A
            </button>

        </div>

    </header>



    <!-- ================= SIDEBAR ================= -->

    <aside class="sidebar" id="sidebar">

        <nav>

            <a href="#" class="sidebar-item active">
                <span>🏠</span>
                <span>Home</span>
            </a>

            <a href="#" class="sidebar-item">
                <span>🔥</span>
                <span>Trending</span>
            </a>

            <a href="#" class="sidebar-item">
                <span>🔴</span>
                <span>Live</span>
            </a>

            <a href="#" class="sidebar-item">
                <span>📺</span>
                <span>Subscriptions</span>
            </a>

            <div class="sidebar-line"></div>

            <a href="#" class="sidebar-item">
                <span>📚</span>
                <span>Library</span>
            </a>

            <a href="#" class="sidebar-item">
                <span>🕒</span>
                <span>History</span>
            </a>

            <a href="#" class="sidebar-item">
                <span>👍</span>
                <span>Liked Videos</span>
            </a>

            <div class="sidebar-line"></div>

            <a href="#" class="sidebar-item">
                <span>⚙️</span>
                <span>Settings</span>
            </a>

        </nav>

    </aside>



    <!-- ================= MAIN ================= -->

    <main class="main-content" id="mainContent">


        <!-- CATEGORY BAR -->

        <div class="category-bar">

            <button class="category active">
                All
            </button>

            <button class="category">
                Telugu
            </button>

            <button class="category">
                Live
            </button>

            <button class="category">
                News
            </button>

            <button class="category">
                Movies
            </button>

            <button class="category">
                Music
            </button>

            <button class="category">
                Gaming
            </button>

            <button class="category">
                Technology
            </button>

        </div>



        <!-- ================= VIDEO SECTION ================= -->

        <section class="video-section">

            <div class="section-header">

                <h1>
                    Live & Featured
                </h1>

                <span class="live-indicator">
                    ● LIVE
                </span>

            </div>


            <div class="video-grid" id="videoGrid">


                <!-- ================= VIDEO 1 ================= -->

                <div
                    class="video-card"
                    data-title="Live Stream 1"
                >

                    <div class="video-wrapper">

                        <iframe
                            class="video-frame"
                            src="https://www.youtube.com/embed/II_m28Bm-iM"
                            title="StreamTube Live Video 1"
                            loading="lazy"
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                            allowfullscreen>
                        </iframe>

                    </div>

                </div>



                <!-- ================= VIDEO 2 ================= -->

                <div
                    class="video-card"
                    data-title="Live Stream 2"
                >

                    <div class="video-wrapper">

                        <iframe
                            class="video-frame"
                            src="https://www.youtube.com/embed/ocy5UgWokKQ"
                            title="StreamTube Live Video 2"
                            loading="lazy"
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                            allowfullscreen>
                        </iframe>

                    </div>

                </div>


                
                <!-- ================= VIDEO 3 ================= -->

                <div
                    class="video-card"
                    data-title="Live Stream 2"
                >

                    <div class="video-wrapper">

                           <iframe width="560" height="315" src="https://www.youtube.com/embed/nRtM9qqIJZk?si=d2NXJahCZWgeBjqa" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
                   

                    </div>

                </div>

                 <!-- ================= VIDEO 4 ================= -->

                <div
                    class="video-card"
                    data-title="Live Stream 2"
                >

                    <div class="video-wrapper">

<iframe width="560" height="315" src="https://www.youtube.com/embed/JSqUrCV6lIs?si=v7ZGuaBeAozkTXxy" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>                   

                    </div>

                </div>


                

                


                

                <!-- ================= TELUGU NEWS ================= -->

                <div
                    class="video-card"
                    data-title="Telugu Live News"
                >

                    <div class="video-wrapper">

                        <iframe
                            class="video-frame"
                            src="https://www.youtube.com/embed?listType=search&list=telugu%20live%20news"
                            title="Telugu Live News"
                            loading="lazy"
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                            allowfullscreen>
                        </iframe>

                    </div>

                </div>

               



                <!-- ================= TELUGU VIDEOS ================= -->

                <div
                    class="video-card"
                    data-title="Telugu News"
                >

                    <div class="video-wrapper">

                        <iframe
                            class="video-frame"
                            src="https://www.youtube.com/embed?listType=search&list=telugu%20news"
                            title="Telugu News"
                            loading="lazy"
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                            allowfullscreen>
                        </iframe>

                    </div>

                </div>


            </div>

        </section>

    </main>



    <!-- ================= JAVASCRIPT ================= -->

    <script src="script.js"></script>

</body>

</html>
